<div class="chat-page">
  <app-sidebar rotaAtiva="consultivo" [usuarioNome]="usuarioNome" (sair)="logout()">
    <button *ngIf="!onboardingEtapa" sidebar-top class="sidebar__new-chat" type="button" (click)="newChat()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14" stroke-linecap="round" />
      </svg>
      <span>Nova conversa</span>
    </button>

    <nav *ngIf="!onboardingEtapa" sidebar-middle class="sidebar__sessions">
      <button
        class="session-item"
        type="button"
        *ngFor="let session of sessions"
        [class.session-item--active]="session.localId === activeSessionId"
        (click)="selectSession(session.localId)"
      >
        <span class="session-item__title">{{ session.title }}</span>
      </button>
    </nav>
  </app-sidebar>

  <main class="chat-main">
    <div class="messages" #messagesList>
      <div class="empty-state" *ngIf="activeSession.messages.length === 0 && !activeSession.loading">
        <div class="empty-state__icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <p class="empty-state__title">Como posso ajudar hoje?</p>
        <p class="empty-state__subtitle">
          Pergunte sobre CMV, precificação, controle de estoque ou compliance sanitário.
        </p>
        <div class="empty-state__exemplos">
          <button
            type="button"
            class="empty-state__exemplo"
            *ngFor="let exemplo of exemplosPergunta"
            (click)="usarExemplo(exemplo)"
          >
            {{ exemplo }}
          </button>
        </div>
      </div>

      <div
        class="message"
        *ngFor="let message of activeSession.messages"
        [class.message--user]="message.role === 'user'"
        [class.message--assistant]="message.role === 'assistant'"
      >
        <div class="message__avatar" *ngIf="message.role === 'assistant'">R</div>
        <div
          class="message__bubble"
          [class.message__bubble--typing]="message.role === 'assistant' && message.text === '' && activeSession.loading"
        >
          <ng-container *ngIf="message.role === 'assistant' && message.text === '' && activeSession.loading; else textoNormal">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </ng-container>
          <ng-template #textoNormal>
            <img class="message__image" *ngIf="message.imageDataUrl" [src]="message.imageDataUrl" alt="Imagem enviada" />
            <p class="message__text">{{ message.text }}</p>
          </ng-template>
        </div>
      </div>
    </div>

    <div class="error-banner" *ngIf="activeSession.errorMessage" [class.error-banner--limite]="activeSession.limiteUsoExcedido">
      <span>{{ activeSession.errorMessage }}</span>
      <a *ngIf="activeSession.limiteUsoExcedido" routerLink="/planos" class="error-banner__upgrade">Fazer upgrade</a>
    </div>

    <div class="image-error" *ngIf="imageError">{{ imageError }}</div>

    <div class="pending-image" *ngIf="pendingImage">
      <img [src]="pendingImage.dataUrl" alt="Pré-visualização da imagem" />
      <button type="button" class="pending-image__remove" (click)="removePendingImage()" aria-label="Remover imagem">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <form class="chat-input" (ngSubmit)="sendMessage()">
      <input
        #imagemInput
        type="file"
        accept="image/jpeg,image/png,image/gif,image/webp"
        hidden
        (change)="onImageSelected($event)"
      />
      <button
        type="button"
        class="chat-input__anexar"
        [disabled]="activeSession.loading || !!onboardingEtapa"
        (click)="imagemInput.click()"
        aria-label="Anexar imagem"
      >
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l8.49-8.49a3.5 3.5 0 0 1 4.95 4.95l-8.49 8.49a2 2 0 0 1-2.83-2.83l7.78-7.78"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <textarea
        name="mensagem"
        rows="1"
        [placeholder]="placeholderInput"
        [(ngModel)]="currentMessage"
        (keydown.enter)="onEnterKey($event)"
        [disabled]="activeSession.loading"
      ></textarea>
      <button type="submit" [disabled]="activeSession.loading || (!currentMessage.trim() && !pendingImage)" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2 11 13" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M22 2 15 22l-4-9-9-4 20-7Z" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </form>
  </main>
</div>
